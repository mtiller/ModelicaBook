# Pandoc defaults for the print pipeline (MIC-85).
# Usage: pandoc --defaults print/pandoc-defaults.yaml -o out.pdf print/*.print.md
#
# Math, fenced code, figures (numbered via implicit_figures), header ids, and
# fenced divs are all native Pandoc. Cross-reference numbering ("Figure 3",
# "Section 2.1") is added with the pandoc-crossref filter (see README).

from: markdown+tex_math_dollars+fenced_divs+implicit_figures+header_attributes
metadata:
  title: Modelica by Example
  lang: en
number-sections: true
toc: true
toc-depth: 2

# PDF engine — Typst is fast and needs no TeX install; swap to xelatex if you
# prefer the classic path. (Either is a print-side dependency, exactly as the
# current Sphinx build depends on xelatex.)
pdf-engine: typst

filters:
  - pandoc-crossref   # numbered cross-references for figures/sections/equations
