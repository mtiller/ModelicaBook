# po4a configuration — ongoing (forward) translation workflow for the MDX book.
#
# po4a keeps ONE English source per document and per-language .po overlays, then
# generates the translated Markdown. This preserves the gettext model the book
# already uses (string-delta translations, fuzzy-marking on change) — the thing
# that would be lost if we hand-maintained a parallel per-locale MDX tree.
#
# Requires po4a (a Perl tool): `brew install po4a` or `apt-get install po4a`.
#
#   Update .pot/.po from the English MDX (after editing content):
#       po4a --no-translations i18n/po4a.cfg
#   Generate the translated MDX for Starlight (respects a % threshold):
#       po4a i18n/po4a.cfg
#
# The generated per-locale files (src/content/docs/<lang>/...) are BUILD
# ARTIFACTS — they are not hand-edited and can be gitignored.

[po_directory] i18n/po

# One entry per chapter. $lang expands over the languages below.
[type: text] src/content/docs/first-order.mdx \
    $lang:src/content/docs/$lang/first-order.mdx \
    opt:"-o markdown -M UTF-8"

# Languages carried over from the existing gettext catalogs.
[po4a_langs] ar cn de es fr it kr pt_BR

# Only emit a translated file when it is sufficiently complete.
[options] opt:"--keep 50"
