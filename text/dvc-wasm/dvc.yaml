# Generated by specs.py. Do not edit by hand.
#
# The wasm stages live in their own pipeline file, not in text/dvc.yaml, because
# `make results` runs `dvc repro dvc.yaml`, which reproduces *every* stage in
# that file. Putting these there made the ordinary book build try to export wasm
# FMUs with whatever omc it had -- and the book-builder image's omc is a release
# build, so it failed with:
#
#   Invalid type of flag simCodeTarget, expected one of None, C, Cpp, ...
#   but got the string "wasm-jit"
#
# Kept separate, `dvc repro dvc.yaml` is native-only and cannot reach these.
